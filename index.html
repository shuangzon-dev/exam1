<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農產運銷刷題神器 - 雲端同步版</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center">
                🌾 農產運銷刷題神器
            </h1>
            <div id="userInfo" class="hidden text-sm md:text-base flex items-center gap-3">
                <span id="userNameDisplay" class="font-semibold bg-emerald-800 px-3 py-1 rounded-full"></span>
                <button onclick="logout()" class="text-xs bg-emerald-900 hover:bg-emerald-950 px-2 py-1 rounded border border-emerald-500">切換使用者</button>
            </div>
        </div>
    </header>

    <!-- 主體內容 -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- 登入區塊 -->
        <section id="loginSection" class="bg-white rounded-xl shadow-md p-6 max-w-md mx-auto my-12 text-center">
            <h2 class="text-2xl font-bold text-emerald-800 mb-2">歡迎使用農產運銷刷題系統</h2>
            <p class="text-slate-600 mb-6 text-sm">輸入您的名字即可建立專屬答題紀錄及錯題本</p>
            <input type="text" id="userNameInput" placeholder="請輸入您的姓名或暱稱" class="w-full border border-slate-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition">開始刷題</button>
        </section>

        <!-- 主選單 -->
        <section id="menuSection" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <!-- 輕鬆刷題卡片 -->
                <div class="bg-white rounded-xl shadow p-5 border-t-4 border-blue-500 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-bold text-blue-700">🌱 輕鬆刷題模式</h3>
                            <span id="easyTotalBadge" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded">載入中...</span>
                        </div>
                        <p class="text-xs text-slate-600 mb-4">
                            隨機抽取全體庫題目，適合平時全方位複習與熟悉題型。
                        </p>
                    </div>
                    <button onclick="startQuiz('easy')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-sm transition">進入輕鬆刷題</button>
                </div>

                <!-- 考前衝刺卡片 -->
                <div class="bg-white rounded-xl shadow p-5 border-t-4 border-amber-500 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-bold text-amber-700">🔥 考前衝刺模式</h3>
                            <span id="sprintTotalBadge" class="text-xs bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded">錯題優先</span>
                        </div>
                        <p class="text-xs text-slate-600 mb-4">
                            優先從您的「錯題本」抽題復習，錯題不足時自動補充隨機題。
                        </p>
                    </div>
                    <button onclick="startQuiz('sprint')" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg text-sm transition">進入錯題衝刺</button>
                </div>

                <!-- 錯題本卡片 -->
                <div class="bg-white rounded-xl shadow p-5 border-t-4 border-rose-500 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-bold text-rose-700">📖 錯題本總覽</h3>
                            <span id="wrongCountBadge" class="text-xs bg-rose-100 text-rose-800 font-semibold px-2 py-0.5 rounded">0 題</span>
                        </div>
                        <p class="text-xs text-slate-600 mb-4">
                            清單式回顧所有答錯題目、正確答案與詳細法規解析。
                        </p>
                    </div>
                    <button onclick="openWrongBook()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-lg text-sm transition">查看錯題清單</button>
                </div>
            </div>

            <!-- 使用者統計資訊 -->
            <div class="bg-white rounded-xl shadow p-4 mb-6">
                <h4 class="text-sm font-bold text-slate-700 mb-2 border-b pb-2">📊 個人學習統計</h4>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <div class="text-xs text-slate-500">輕鬆模式已掌握</div>
                        <div id="statEasySolved" class="text-lg font-bold text-blue-600">0 / 0</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <div class="text-xs text-slate-500">衝刺模式已掌握</div>
                        <div id="statSprintSolved" class="text-lg font-bold text-amber-600">0 / 0</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <div class="text-xs text-slate-500">錯題本累積題數</div>
                        <div id="statWrongTotal" class="text-lg font-bold text-rose-600">0 題</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <div class="text-xs text-slate-500">累計作答次數</div>
                        <div id="statTotalAnswered" class="text-lg font-bold text-emerald-600">0 次</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 刷題進行頁面 -->
        <section id="quizSection" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="backToMenu()" class="text-sm text-slate-600 hover:text-slate-900 flex items-center">
                    ← 返回主選單
                </button>
                <span id="currentModeBadge" class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-200"></span>
            </div>

            <!-- 題目卡片 -->
            <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                <div class="flex justify-between items-start mb-3">
                    <span id="qTypeBadge" class="text-xs font-bold px-2 py-1 rounded bg-slate-100 text-slate-700"></span>
                    <span id="qSource" class="text-xs text-slate-400"></span>
                </div>
                <h3 id="qTitle" class="text-lg font-bold text-slate-800 mb-6 leading-relaxed"></h3>

                <!-- 選項區塊 -->
                <div id="optionsContainer" class="space-y-3 mb-6"></div>

                <!-- 複選題提交按鈕 -->
                <button id="submitMultiBtn" onclick="submitMultiAnswer()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg mb-4">
                    確認送出答案
                </button>

                <!-- 解析區塊 -->
                <div id="explanationContainer" class="hidden mt-6 p-4 rounded-lg bg-slate-50 border border-slate-200">
                    <div id="resultHeader" class="text-base font-bold mb-2"></div>
                    <div class="text-sm text-slate-700 mb-2">
                        <span class="font-semibold text-emerald-800">【正確答案】：</span>
                        <span id="correctAnswerText" class="font-bold text-emerald-600"></span>
                    </div>
                    <div class="text-sm text-slate-700 leading-relaxed border-t pt-2 mt-2">
                        <span class="font-semibold text-emerald-800">【法規與概念解析】：</span>
                        <div id="explanationText" class="mt-1"></div>
                    </div>
                    <button onclick="nextQuestion()" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">
                        下一題 →
                    </button>
                </div>
            </div>
        </section>

        <!-- 錯題本頁面 -->
        <section id="wrongBookSection" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <button onclick="backToMenu()" class="text-sm text-slate-600 hover:text-slate-900 flex items-center">
                    ← 返回主選單
                </button>
                <h2 class="text-xl font-bold text-rose-700">📖 我的錯題本總覽</h2>
            </div>
            <div id="wrongList" class="space-y-4"></div>
        </section>

    </main>

    <!-- 系統邏輯腳本 -->
    <script>
        // 全域變數
        let easyDb = [];
        let currentUser = "";
        let currentMode = ""; 
        let currentQuestions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let wrongBook = []; 
        let solvedEasy = new Set();
        let solvedSprint = new Set();
        let totalAnswered = 0;

        window.onload = async function() {
            await initDatabase();
            loadUserData();
        };

        // 從遠端 JSON 讀取最新題庫（帶時間戳記防止 HTTP 快取）
        async function initDatabase() {
            try {
                const response = await fetch('questions.json?v=' + new Date().getTime());
                if (!response.ok) {
                    throw new Error('無法取得遠端題目檔');
                }
                easyDb = await response.json();
                document.getElementById('easyTotalBadge').innerText = `共 ${easyDb.length} 題`;
            } catch (error) {
                console.error("載入題庫失敗：", error);
                alert("無法載入雲端題庫，請確認 questions.json 檔案是否存在！");
            }
        }

        function loadUserData() {
            const savedUser = localStorage.getItem('quiz_user');
            if (savedUser) {
                currentUser = savedUser;
                document.getElementById('userNameDisplay').innerText = currentUser;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('menuSection').classList.remove('hidden');

                const wrongData = localStorage.getItem(`wrong_${currentUser}`);
                wrongBook = wrongData ? JSON.parse(wrongData) : [];

                const statsData = localStorage.getItem(`stats_${currentUser}`);
                if (statsData) {
                    const stats = JSON.parse(statsData);
                    solvedEasy = new Set(stats.solvedEasy || []);
                    solvedSprint = new Set(stats.solvedSprint || []);
                    totalAnswered = stats.totalAnswered || 0;
                }
                updateStatsUI();
            }
        }

        function saveUserData() {
            if (!currentUser) return;
            localStorage.setItem(`wrong_${currentUser}`, JSON.stringify(wrongBook));
            localStorage.setItem(`stats_${currentUser}`, JSON.stringify({
                solvedEasy: Array.from(solvedEasy),
                solvedSprint: Array.from(solvedSprint),
                totalAnswered: totalAnswered
            }));
        }

        function login() {
            const nameInput = document.getElementById('userNameInput').value.trim();
            if (!nameInput) {
                alert('請輸入姓名或暱稱');
                return;
            }
            currentUser = nameInput;
            localStorage.setItem('quiz_user', currentUser);
            loadUserData();
        }

        function logout() {
            localStorage.removeItem('quiz_user');
            location.reload();
        }

        function updateStatsUI() {
            document.getElementById('statEasySolved').innerText = `${solvedEasy.size} / ${easyDb.length}`;
            document.getElementById('statSprintSolved').innerText = `${solvedSprint.size} / ${easyDb.length}`;
            document.getElementById('statWrongTotal').innerText = `${wrongBook.length} 題`;
            document.getElementById('statTotalAnswered').innerText = `${totalAnswered} 次`;
            document.getElementById('wrongCountBadge').innerText = `${wrongBook.length} 題`;
            document.getElementById('easyTotalBadge').innerText = `共 ${easyDb.length} 題`;
        }

        function backToMenu() {
            document.getElementById('quizSection').classList.add('hidden');
            document.getElementById('wrongBookSection').classList.add('hidden');
            document.getElementById('menuSection').classList.remove('hidden');
            updateStatsUI();
        }

        function startQuiz(mode) {
            currentMode = mode;
            document.getElementById('menuSection').classList.add('hidden');
            document.getElementById('quizSection').classList.remove('hidden');

            const badge = document.getElementById('currentModeBadge');
            
            if (mode === 'easy') {
                badge.innerText = '🌱 輕鬆刷題模式 (全題庫隨機)';
                badge.className = 'text-xs font-semibold px-3 py-1 rounded-full bg-blue-100 text-blue-800';
                currentQuestions = [...easyDb].sort(() => 0.5 - Math.random());
            } else if (mode === 'sprint') {
                badge.innerText = '🔥 考前衝刺模式 (錯題優先抽題)';
                badge.className = 'text-xs font-semibold px-3 py-1 rounded-full bg-amber-100 text-amber-800';
                
                if (wrongBook.length > 0) {
                    let shuffledWrong = [...wrongBook].sort(() => 0.5 - Math.random());
                    if (shuffledWrong.length < 15) {
                        const wrongIds = new Set(shuffledWrong.map(q => q.id));
                        const remaining = easyDb.filter(q => !wrongIds.has(q.id)).sort(() => 0.5 - Math.random());
                        currentQuestions = [...shuffledWrong, ...remaining.slice(0, 15 - shuffledWrong.length)];
                    } else {
                        currentQuestions = shuffledWrong;
                    }
                } else {
                    alert('目前錯題本無題目，將為您隨機抽取 15 題進行衝刺挑戰！');
                    currentQuestions = [...easyDb].sort(() => 0.5 - Math.random()).slice(0, 15);
                }
            }

            currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (currentIndex >= currentQuestions.length) {
                alert('🎉 恭喜您已完成本組刷題！將返回主選單。');
                backToMenu();
                return;
            }

            const q = currentQuestions[currentIndex];
            document.getElementById('qSource').innerText = q.category || '';
            document.getElementById('qTitle').innerText = `${currentIndex + 1}. ${q.question}`;
            
            const typeBadge = document.getElementById('qTypeBadge');
            if (q.type === 'tf') typeBadge.innerText = '是非題';
            else if (q.type === 'single') typeBadge.innerText = '單選題';
            else typeBadge.innerText = '複選題';

            document.getElementById('explanationContainer').classList.add('hidden');
            const submitBtn = document.getElementById('submitMultiBtn');
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            userAnswers = {};

            if (q.type === 'multiple') {
                submitBtn.classList.remove('hidden');
            } else {
                submitBtn.classList.add('hidden');
            }

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3.5 rounded-lg border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/50 transition flex items-center justify-between text-sm md:text-base';
                
                if (q.type === 'multiple') {
                    btn.innerHTML = `<span>${opt}</span><span id="chk_${idx}" class="text-xs border px-2 py-0.5 rounded text-slate-400">未選</span>`;
                    btn.onclick = () => toggleMultiOption(idx, opt, btn);
                } else {
                    btn.innerText = opt;
                    btn.onclick = () => submitSingleAnswer(opt);
                }
                optionsContainer.appendChild(btn);
            });
        }

        function submitSingleAnswer(selectedOpt) {
            const q = currentQuestions[currentIndex];
            totalAnswered++;
            const correctArr = Array.isArray(q.answer) ? q.answer : [q.answer];
            const isCorrect = correctArr.includes(selectedOpt);

            showResult(isCorrect, correctArr, q);
        }

        function toggleMultiOption(idx, opt, btn) {
            const chk = document.getElementById(`chk_${idx}`);
            if (userAnswers[opt]) {
                delete userAnswers[opt];
                chk.innerText = '未選';
                chk.className = 'text-xs border px-2 py-0.5 rounded text-slate-400';
                btn.classList.remove('border-emerald-500', 'bg-emerald-50');
            } else {
                userAnswers[opt] = true;
                chk.innerText = '已選';
                chk.className = 'text-xs border bg-emerald-600 text-white px-2 py-0.5 rounded';
                btn.classList.add('border-emerald-500', 'bg-emerald-50');
            }
        }

        function submitMultiAnswer() {
            const q = currentQuestions[currentIndex];
            const selectedArr = Object.keys(userAnswers);
            if (selectedArr.length === 0) {
                alert('請至少選擇一個選項！');
                return;
            }

            totalAnswered++;
            const correctArr = Array.isArray(q.answer) ? q.answer : [q.answer];
            const isCorrect = selectedArr.length === correctArr.length && 
                              selectedArr.every(opt => correctArr.includes(opt));

            showResult(isCorrect, correctArr, q);
        }

        function showResult(isCorrect, correctArr, q) {
            const resultHeader = document.getElementById('resultHeader');
            if (isCorrect) {
                resultHeader.innerText = '🎉 回答正確！';
                resultHeader.className = 'text-base font-bold mb-2 text-emerald-600';
                
                if (currentMode === 'easy') solvedEasy.add(q.id);
                if (currentMode === 'sprint') {
                    solvedSprint.add(q.id);
                    wrongBook = wrongBook.filter(item => item.id !== q.id);
                }
            } else {
                resultHeader.innerText = '❌ 回答錯誤！已加入錯題本';
                resultHeader.className = 'text-base font-bold mb-2 text-rose-600';
                
                if (!wrongBook.some(item => item.id === q.id)) {
                    wrongBook.push(q);
                }
            }

            saveUserData();

            document.getElementById('correctAnswerText').innerText = correctArr.join('、');
            document.getElementById('explanationText').innerText = q.explanation || '無詳細解析。';
            document.getElementById('explanationContainer').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
        }

        function openWrongBook() {
            document.getElementById('menuSection').classList.add('hidden');
            document.getElementById('wrongBookSection').classList.remove('hidden');

            const list = document.getElementById('wrongList');
            list.innerHTML = '';

            if (wrongBook.length === 0) {
                list.innerHTML = '<div class="text-center text-slate-500 py-12 bg-white rounded-xl shadow">🎉 太厲害了！目前完全沒有累積錯題！</div>';
                return;
            }

            wrongBook.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow p-5 border-l-4 border-rose-500';
                const correctStr = Array.isArray(q.answer) ? q.answer.join('、') : q.answer;
                card.innerHTML = `
                    <div class="text-xs text-slate-400 mb-1">${q.category}</div>
                    <div class="font-bold text-slate-800 mb-2">${idx + 1}. ${q.question}</div>
                    <div class="text-sm text-emerald-600 font-semibold mb-2">正確答案：${correctStr}</div>
                    <div class="text-xs text-slate-600 bg-slate-50 p-3 rounded border leading-relaxed">
                        <span class="font-bold text-slate-700">【法規解析】：</span>${q.explanation || '無解析'}
                    </div>
                `;
                list.appendChild(card);
            });
        }
    </script>
</body>
</html>
