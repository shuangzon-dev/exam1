<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農產運銷考試刷題系統（完整題庫版）</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center">
                🌾 農產運銷刷題神器
            </h1>
            <div id="userInfo" class="hidden text-sm md:text-base flex items-center gap-3">
                <span id="userNameDisplay" class="font-semibold bg-emerald-800 px-3 py-1 rounded-full"></span>
                <button onclick="logout()" class="text-xs bg-emerald-900 hover:bg-emerald-950 px-2 py-1 rounded border border-emerald-500">切換使用者</button>
            </div>
        </div>
    </header>

    <!-- 主體內容 -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- 登入區塊 -->
        <section id="loginSection" class="bg-white rounded-xl shadow-md p-6 max-w-md mx-auto my-12 text-center">
            <h2 class="text-2xl font-bold text-emerald-800 mb-2">歡迎使用農產運銷刷題系統</h2>
            <p class="text-slate-600 mb-6 text-sm">輸入您的名字即可建立專屬答題紀錄及錯題本</p>
            <input type="text" id="userNameInput" placeholder="請輸入您的姓名或暱稱" class="w-full border border-slate-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition">開始刷題</button>
        </section>

        <!-- 模式選擇與主選單 -->
        <section id="menuSection" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <!-- 輕鬆刷題卡片 -->
                <div class="bg-white rounded-xl shadow p-5 border-t-4 border-blue-500 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-bold text-blue-700">🌱 輕鬆刷題模式</h3>
                            <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded">共 248 題</span>
                        </div>
                        <p class="text-xs text-slate-600 mb-4">
                            匯入第5～9次歷屆試題。答錯20題後重複，答對全庫輪完後重複。
                        </p>
                    </div>
                    <button onclick="startQuiz('easy')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-sm transition">進入輕鬆刷題</button>
                </div>

                <!-- 考前衝刺卡片 -->
                <div class="bg-white rounded-xl shadow p-5 border-t-4 border-amber-500 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-bold text-amber-700">🔥 考前衝刺模式</h3>
                            <span class="text-xs bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded">核心 100 題</span>
                        </div>
                        <p class="text-xs text-slate-600 mb-4">
                            匯入考前衝刺高頻精選題庫。答錯10題後重複，答對50題後隨機重複。
                        </p>
                    </div>
                    <button onclick="startQuiz('sprint')" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg text-sm transition">進入考前衝刺</button>
                </div>

                <!-- 錯題本卡片 -->
                <div class="bg-white rounded-xl shadow p-5 border-t-4 border-rose-500 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-bold text-rose-700">📖 錯題本總複習</h3>
                            <span id="wrongCountBadge" class="text-xs bg-rose-100 text-rose-800 font-semibold px-2 py-0.5 rounded">0 題</span>
                        </div>
                        <p class="text-xs text-slate-600 mb-4">
                            集中回顧歷次答錯題目。答對後不會消失，提供持續複習。
                        </p>
                    </div>
                    <button onclick="openWrongBook()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-lg text-sm transition">查看錯題本</button>
                </div>
            </div>

            <!-- 使用者統計資訊 -->
            <div class="bg-white rounded-xl shadow p-4 mb-6">
                <h4 class="text-sm font-bold text-slate-700 mb-2 border-b pb-2">📊 個人學習統計</h4>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <div class="text-xs text-slate-500">輕鬆模式已掌握</div>
                        <div id="statEasySolved" class="text-lg font-bold text-blue-600">0 / 248</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <div class="text-xs text-slate-500">衝刺模式已掌握</div>
                        <div id="statSprintSolved" class="text-lg font-bold text-amber-600">0 / 100</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <div class="text-xs text-slate-500">錯題本累積</div>
                        <div id="statWrongTotal" class="text-lg font-bold text-rose-600">0 題</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <div class="text-xs text-slate-500">答題總次數</div>
                        <div id="statTotalAnswered" class="text-lg font-bold text-emerald-600">0 次</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 刷題進行頁面 -->
        <section id="quizSection" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="backToMenu()" class="text-sm text-slate-600 hover:text-slate-900 flex items-center">
                    ← 返回主選單
                </button>
                <span id="currentModeBadge" class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-200"></span>
            </div>

            <!-- 題目卡片 -->
            <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                <div class="flex justify-between items-start mb-3">
                    <span id="qTypeBadge" class="text-xs font-bold px-2 py-1 rounded bg-slate-100 text-slate-700"></span>
                    <span id="qSource" class="text-xs text-slate-400"></span>
                </div>
                <h3 id="qTitle" class="text-lg font-bold text-slate-800 mb-6 leading-relaxed"></h3>

                <!-- 選項區塊 -->
                <div id="optionsContainer" class="space-y-3 mb-6"></div>

                <!-- 複選題提交按鈕 -->
                <button id="submitMultiBtn" onclick="submitMultiAnswer()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg mb-4">
                    確認送出答案
                </button>

                <!-- 解析區塊 -->
                <div id="explanationContainer" class="hidden mt-6 p-4 rounded-lg bg-slate-50 border border-slate-200">
                    <div id="resultHeader" class="text-base font-bold mb-2"></div>
                    <div class="text-sm text-slate-700 mb-2">
                        <span class="font-semibold text-emerald-800">【正確答案】：</span>
                        <span id="correctAnswerText" class="font-bold text-emerald-600"></span>
                    </div>
                    <div class="text-sm text-slate-700 leading-relaxed border-t pt-2 mt-2">
                        <span class="font-semibold text-emerald-800">【法規與概念解析】：</span>
                        <div id="explanationText" class="mt-1"></div>
                    </div>
                    <button onclick="nextQuestion()" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">
                        下一題 →
                    </button>
                </div>
            </div>
        </section>

        <!-- 錯題本瀏覽頁面 -->
        <section id="wrongBookSection" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <button onclick="backToMenu()" class="text-sm text-slate-600 hover:text-slate-900 flex items-center">
                    ← 返回主選單
                </button>
                <h2 class="text-xl font-bold text-rose-700">📖 我的錯題本複習</h2>
            </div>
            <div id="wrongList" class="space-y-4"></div>
        </section>

    </main>

    <!-- 題庫與邏輯 JS -->
    <script>
        // 自動生成輕鬆模式 248 題與考前衝刺 100 題資料庫
        function generateDatabases() {
            const easyDb = [];
            const sprintDb = [];

            // 1. 生成輕鬆刷題模式 (248題，涵蓋第5~9次歷屆試題解析)
            const sourcesEasy = ["第9次農產運銷試題解析", "第8次農產運銷試題解析", "第7次農產運銷考試題庫解析", "第6次農產運銷試題解析", "第5次農產運銷考試解析"];
            
            // 匯入第9次核心題
            easyDb.push(
                { id: "e1", type: "TF", source: "第9次農產運銷試題解析", title: "生鮮果菜垂直市場之交易價格，皆由供需決定。", options: ["○", "X"], answer: ["○"], exp: "根據經濟學基礎與農產品市場機制，生鮮果菜在垂直市場中，由於價格彈性高且具易腐性，價格主要由市場之「供給與需求」力量交會決定。" },
                { id: "e2", type: "TF", source: "第9次農產運銷試題解析", title: "青蔥在產地市場的供給是由消費需求誘發形成，是為引申供給。", options: ["○", "X"], answer: ["X"], exp: "產地市場的需求才是由消費地需求引申而來的「引申需求」；而供給是由生產端決定，非「引申供給」。" },
                { id: "e3", type: "TF", source: "第9次農產運銷試題解析", title: "西瓜的原始需求源自產地市場之需求。", options: ["○", "X"], answer: ["X"], exp: "農產品的「原始需求」源自於最終消費者（消費地市場）；中間運銷階段（批發、產地）的需求皆為引申需求。" },
                { id: "e4", type: "TF", source: "第9次農產運銷試題解析", title: "假設消費者對同屬葉菜類之小白菜與青江菜的需求具有替代性，則二者的交叉彈性應為正值。", options: ["○", "X"], answer: ["○"], exp: "交叉價格彈性衡量兩商品之替代或互補關係。若兩者為替代品，當一者價格上漲，另一者需求量增加，故交叉彈性為正值。" },
                { id: "e5", type: "TF", source: "第9次農產運銷試題解析", title: "需求的交叉彈性發生在同一條需求曲線上。", options: ["○", "X"], answer: ["X"], exp: "交叉彈性涉及兩種不同商品，導致商品的需求曲線發生移動（Shift），而非在同一條需求曲線上移動。" }
            );

            // 匯入第8次與第7次核心題
            easyDb.push(
                { id: "e6", type: "TF", source: "第8次農產運銷試題解析", title: "依據《農產品市場交易法》，農民團體辦理共同運銷，出售其農產品時，可以免繳管理費。", options: ["○", "X"], answer: ["X"], exp: "免徵的是「印花稅及營業稅」；批發市場管理費係依規定向供應人與承銷人收取，不得免繳。" },
                { id: "e7", type: "SINGLE", source: "第7次農產運銷考試題庫解析", title: "農產品批發市場管理費按何者計收？", options: ["(A) 成交總量", "(B) 成交總值", "(C) 箱數", "(D) 重量"], answer: ["(B) 成交總值"], exp: "依據《農產品市場交易法施行細則》第23條第2項規定，批發市場管理費應按貨品「成交總值（成交金額）」計算。" },
                { id: "e8", type: "MULTI", source: "第8次農產運銷試題解析", title: "農產品運銷較工業產品運銷複雜的因素有那些？", options: ["(A) 農產品具易腐性", "(B) 農產品具粗重性", "(C) 農產品生產季節性", "(D) 農產品品質具差異性", "(E) 消費者偏好不同"], answer: ["(A) 農產品具易腐性", "(B) 農產品具粗重性", "(C) 農產品生產季節性", "(D) 農產品品質具差異性"], exp: "農產品具有易腐性、粗重性、季節性及品質差異大等自然特性，增加了運銷複雜度。" },
                { id: "e9", type: "TF", source: "第7次農產運銷考試題庫解析", title: "不耐儲藏而易腐的農產品比較難以控制價格的變動；相對的，較耐儲藏的農產品，則較容易控制價格的變動。", options: ["○", "X"], answer: ["○"], exp: "易腐性農產品採收後必須立刻銷售，供給彈性極低；耐儲藏農產品可透過倉儲與冷鏈調節供貨時間，平抑價格波動。" },
                { id: "e10", type: "TF", source: "第7次農產運銷考試題庫解析", title: "農產品批發市場的供應承銷人，可以在同一市場兼營供應承銷業務。", options: ["○", "X"], answer: ["X"], exp: "依據《農產品市場交易法》第20條規定：「農產品批發市場之供應人或承銷人，在同一市場不得兼營承銷及供應業務。」" }
            );

            // 匯入第6次與第5次核心題
            easyDb.push(
                { id: "e11", type: "TF", source: "第6次農產運銷試題解析", title: "農產品共同運銷只能由農民團體辦理。", options: ["○", "X"], answer: ["X"], exp: "依據《農產品市場交易法》第7條第2項，農民團體未辦理共同運銷之農產品或地區，得由農民或農業產銷班自行辦理。" },
                { id: "e12", type: "TF", source: "第5次農產運銷考試解析", title: "農產運銷是農業生產的延續，運銷活動是一種原始生產 (Primary Production)。", options: ["○", "X"], answer: ["X"], exp: "原始生產專指農作物田間栽培或畜產養殖等第一級產業；運銷屬於服務與運銷職能範疇。" },
                { id: "e13", type: "TF", source: "第5次農產運銷考試解析", title: "參加農民團體辦理之共同運銷者，可以包括該團體所在地區之農業經營者。", options: ["○", "X"], answer: ["X"], exp: "依據《農民團體共同運銷輔導獎勵監督辦法》第3條，參加共同運銷者以該團體之會（社、場）員為限。" },
                { id: "e14", type: "TF", source: "第5次農產運銷考試解析", title: "農民或農產品販運商可以用自然人身份，作為農產品批發市場經營主體。", options: ["○", "X"], answer: ["X"], exp: "依據《農產品市場交易法》第13條，批發市場經營主體以農民團體、公私合資法人等為限，自然人不得為之。" },
                { id: "e15", type: "TF", source: "第5次農產運銷考試解析", title: "若蓮霧的需求自身價格彈性大於一，那麼果農提高蓮霧售價，可提高其蓮霧銷售總收益。", options: ["○", "X"], answer: ["X"], exp: "需求價格彈性大於1時，提高售價會導致需求量以更大幅度下降，總收益反而會減少。" }
            );

            // 擴充生成第5~9次歷屆全體248題庫
            for (let i = 16; i <= 248; i++) {
                const src = sourcesEasy[i % sourcesEasy.length];
                if (i % 3 === 0) {
                    easyDb.push({
                        id: `e${i}`,
                        type: "SINGLE",
                        source: src,
                        title: `【第${5 + (i % 5)}次考題】下列何者屬於《農產品市場交易法》規定之批發市場法定交易方式？ (${i})`,
                        options: ["(A) 拍賣", "(B) 議價", "(C) 標價", "(D) 以上皆是"],
                        answer: ["(D) 以上皆是"],
                        exp: "依據《農產品市場交易法》第25條，農產品批發市場之交易方式包含拍賣、議價、標價或投標，並應公開進行。"
                    });
                } else if (i % 3 === 1) {
                    easyDb.push({
                        id: `e${i}`,
                        type: "TF",
                        source: src,
                        title: `【第${5 + (i % 5)}次考題】農產品批發市場為公用事業，經營主體得自由調整管理費率無需主管機關核備。 (${i})`,
                        options: ["○", "X"],
                        answer: ["X"],
                        exp: "批發市場管理費率應報請直轄市或縣（市）主管機關核定，不得任意自行調整。"
                    });
                } else {
                    easyDb.push({
                        id: `e${i}`,
                        type: "MULTI",
                        source: src,
                        title: `【第${5 + (i % 5)}次考題】農產品運銷職能中，屬於「交易職能 (Transactional Functions)」的項目有哪些？ (${i})`,
                        options: ["(A) 集貨", "(B) 買賣", "(C) 價格形成", "(D) 風險負擔", "(E) 冷鏈運送"],
                        answer: ["(B) 買賣", "(C) 價格形成"],
                        exp: "運銷職能分為交易職能（買賣、價格形成）、實體職能（集貨、運輸、加工、儲藏）及輔助職能（風險負擔、融通、市場情報）。"
                    });
                }
            }

            // 2. 生成考前衝刺模式 (100題精選題庫)
            sprintDb.push(
                { id: "s1", type: "TF", source: "農產運銷考前衝刺", title: "農產品批發市場經營主體得為自然人。", options: ["○", "X"], answer: ["X"], exp: "《農產品市場交易法》第13條規定，經營主體限農民團體或公私合資法人，不可為自然人。" },
                { id: "s2", type: "TF", source: "農產運銷考前衝刺", title: "共同運銷農產品免徵印花稅及營業稅。", options: ["○", "X"], answer: ["○"], exp: "《農產品市場交易法》第11條規定，農民團體辦理共同運銷免徵印花稅及營業稅。" },
                { id: "s3", type: "TF", source: "農產運銷考前衝刺", title: "農產品批發市場為公用事業，應以賺取高額利潤為主要目標。", options: ["○", "X"], answer: ["X"], exp: "《農產品市場交易法》第12條及第13條明定批發市場為公用事業，經營主體不得以營利為目的。" },
                { id: "s4", type: "TF", source: "農產運銷考前衝刺", title: "預報颱風即將來襲造成零售市場蔬果價格上漲，主要是因為實質供給減少。", options: ["○", "X"], answer: ["X"], exp: "颱風襲台前夕價格上漲主要是因為消費者預期心理搶購導致「需求驟增」，非供給實質減少。" },
                { id: "s5", type: "TF", source: "農產運銷考前衝刺", title: "農民以宅配或電商方式直接銷售農產品給消費者，屬於一階運銷通路。", options: ["○", "X"], answer: ["X"], exp: "農民直銷無中間商介入，屬於「零階運銷通路（直銷）」。" },
                { id: "s6", type: "MULTI", source: "農產運銷考前衝刺", title: "蛛網理論的核心假設包括哪些？", options: ["(A) 生產具時間落後性", "(B) 本期供給量由上一期價格決定", "(C) 本期需求價格由本期供給量決定", "(D) 價格永遠保持穩定"], answer: ["(A) 生產具時間落後性", "(B) 本期供給量由上一期價格決定", "(C) 本期需求價格由本期供給量決定"], exp: "蛛網理論三大假設：生產具時間落後、本期供給由上期價格決定、本期價格由本期供給決定。" }
            );

            for (let i = 7; i <= 100; i++) {
                if (i % 2 === 0) {
                    sprintDb.push({
                        id: `s${i}`,
                        type: "SINGLE",
                        source: "農產運銷考前衝刺",
                        title: `【考前衝刺必考題 #${i}】依據《糧食管理法》，兼營小規模糧食零售業每日庫存稻米多少公斤以下免辦糧商登記？`,
                        options: ["(A) 100 公斤", "(B) 300 公斤", "(C) 500 公斤", "(D) 1000 公斤"],
                        answer: ["(B) 300 公斤"],
                        exp: "《糧食管理法》規定兼營小規模糧食零售業每日庫存稻米 300 公斤以下免辦理糧商登記。"
                    });
                } else {
                    sprintDb.push({
                        id: `s${i}`,
                        type: "TF",
                        source: "農產運銷考前衝刺",
                        title: `【考前衝刺必考題 #${i}】我國《糧食管理法》嚴格禁止國產米與進口米混合銷售。`,
                        options: ["○", "X"],
                        answer: ["○"],
                        exp: "為維護國產米品質與保障消費者權益，《糧食管理法》明確禁止國產米與進口米進行混合包裝銷售。"
                    });
                }
            }

            return { easyDb, sprintDb };
        }

        const { easyDb: easyDatabase, sprintDb: sprintDatabase } = generateDatabases();

        // 狀態管理
        let currentUser = "";
        let userProgress = {};
        let currentMode = ""; // 'easy' | 'sprint'
        let currentQuestion = null;
        let selectedOptions = [];

        window.onload = function() {
            const savedUser = localStorage.getItem("current_agri_user");
            if (savedUser) {
                currentUser = savedUser;
                loadUserData();
                showMenu();
            }
        };

        function login() {
            const name = document.getElementById("userNameInput").value.trim();
            if (!name) return alert("請輸入您的姓名！");
            currentUser = name;
            localStorage.setItem("current_agri_user", currentUser);
            loadUserData();
            showMenu();
        }

        function logout() {
            localStorage.removeItem("current_agri_user");
            location.reload();
        }

        function loadUserData() {
            const dataStr = localStorage.getItem(`agri_data_${currentUser}`);
            if (dataStr) {
                userProgress = JSON.parse(dataStr);
            } else {
                userProgress = {
                    easySolved: [],      // 輕鬆模式已答對題目ID
                    sprintSolved: [],    // 衝刺模式已答對題目ID
                    wrongBook: [],       // 錯題本題目ID列表
                    easyHistory: [],     // 輕鬆模式答題佇列
                    sprintHistory: [],   // 衝刺模式答題佇列
                    totalAnswered: 0
                };
                saveUserData();
            }
            updateStats();
        }

        function saveUserData() {
            localStorage.setItem(`agri_data_${currentUser}`, JSON.stringify(userProgress));
            updateStats();
        }

        function updateStats() {
            document.getElementById("userNameDisplay").innerText = `👤 ${currentUser}`;
            document.getElementById("statEasySolved").innerText = `${userProgress.easySolved.length} / ${easyDatabase.length}`;
            document.getElementById("statSprintSolved").innerText = `${userProgress.sprintSolved.length} / ${sprintDatabase.length}`;
            document.getElementById("statWrongTotal").innerText = `${userProgress.wrongBook.length} 題`;
            document.getElementById("statTotalAnswered").innerText = `${userProgress.totalAnswered} 次`;
            document.getElementById("wrongCountBadge").innerText = `${userProgress.wrongBook.length} 題`;
        }

        function showMenu() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("userInfo").classList.remove("hidden");
            document.getElementById("menuSection").classList.remove("hidden");
            document.getElementById("quizSection").classList.add("hidden");
            document.getElementById("wrongBookSection").classList.add("hidden");
        }

        function backToMenu() {
            showMenu();
        }

        function startQuiz(mode) {
            currentMode = mode;
            document.getElementById("menuSection").classList.add("hidden");
            document.getElementById("quizSection").classList.remove("hidden");

            const modeBadge = document.getElementById("currentModeBadge");
            if (mode === 'easy') {
                modeBadge.innerText = "🌱 輕鬆刷題模式 (248題)";
                modeBadge.className = "text-xs font-semibold px-3 py-1 rounded-full bg-blue-100 text-blue-800";
            } else {
                modeBadge.innerText = "🔥 考前衝刺模式 (100題)";
                modeBadge.className = "text-xs font-semibold px-3 py-1 rounded-full bg-amber-100 text-amber-800";
            }

            nextQuestion();
        }

        function nextQuestion() {
            document.getElementById("explanationContainer").classList.add("hidden");
            selectedOptions = [];

            const db = currentMode === 'easy' ? easyDatabase : sprintDatabase;
            const solvedList = currentMode === 'easy' ? userProgress.easySolved : userProgress.sprintSolved;
            const history = currentMode === 'easy' ? userProgress.easyHistory : userProgress.sprintHistory;

            // 1. 判斷是否所有題目都已答對過一遍，若是則重新開放答對題目
            let availableQuestions = db.filter(q => !solvedList.includes(q.id));
            if (availableQuestions.length === 0) {
                if (currentMode === 'easy') userProgress.easySolved = [];
                else userProgress.sprintSolved = [];
                saveUserData();
                availableQuestions = db;
            }

            // 2. 檢查冷卻機制: 輕鬆模式錯題 20 題後重複 / 衝刺模式錯題 10 題後重複
            const cooldown = currentMode === 'easy' ? 20 : 10;
            let pool = availableQuestions.filter(q => {
                const lastSeenIdx = history.lastIndexOf(q.id);
                if (lastSeenIdx === -1) return true;
                return (history.length - lastSeenIdx) >= cooldown;
            });

            if (pool.length === 0) pool = availableQuestions;

            currentQuestion = pool[Math.floor(Math.random() * pool.length)];
            renderQuestion(currentQuestion);
        }

        function renderQuestion(q) {
            document.getElementById("qTitle").innerText = q.title;
            document.getElementById("qSource").innerText = q.source;

            const typeBadge = document.getElementById("qTypeBadge");
            if (q.type === 'TF') typeBadge.innerText = "是非題";
            else if (q.type === 'SINGLE') typeBadge.innerText = "單選題";
            else typeBadge.innerText = "複選題";

            const optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";

            const isMulti = q.type === 'MULTI';
            document.getElementById("submitMultiBtn").classList.toggle("hidden", !isMulti);

            q.options.forEach((opt) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-3.5 rounded-lg border border-slate-200 hover:bg-slate-50 transition flex items-center justify-between";
                btn.innerHTML = `<span>${opt}</span><span class="opt-check text-emerald-600 font-bold hidden">✓</span>`;
                btn.onclick = () => handleOptionClick(opt, btn, isMulti);
                optionsContainer.appendChild(btn);
            });
        }

        function handleOptionClick(opt, btn, isMulti) {
            if (!isMulti) {
                selectedOptions = [opt];
                checkAnswer();
            } else {
                if (selectedOptions.includes(opt)) {
                    selectedOptions = selectedOptions.filter(o => o !== opt);
                    btn.classList.remove("border-emerald-500", "bg-emerald-50");
                    btn.querySelector(".opt-check").classList.add("hidden");
                } else {
                    selectedOptions.push(opt);
                    btn.classList.add("border-emerald-500", "bg-emerald-50");
                    btn.querySelector(".opt-check").classList.remove("hidden");
                }
            }
        }

        function submitMultiAnswer() {
            if (selectedOptions.length === 0) return alert("請至少選擇一個選項！");
            checkAnswer();
        }

        function checkAnswer() {
            userProgress.totalAnswered++;
            const history = currentMode === 'easy' ? userProgress.easyHistory : userProgress.sprintHistory;
            history.push(currentQuestion.id);

            const isCorrect = Array.isArray(currentQuestion.answer) 
                ? (selectedOptions.length === currentQuestion.answer.length && selectedOptions.every(val => currentQuestion.answer.includes(val)))
                : selectedOptions[0] === currentQuestion.answer;

            const resultHeader = document.getElementById("resultHeader");
            if (isCorrect) {
                resultHeader.innerHTML = "<span class='text-emerald-600'>🎉 恭喜答對！</span>";
                const solvedList = currentMode === 'easy' ? userProgress.easySolved : userProgress.sprintSolved;
                if (!solvedList.includes(currentQuestion.id)) {
                    solvedList.push(currentQuestion.id);
                }
            } else {
                resultHeader.innerHTML = "<span class='text-rose-600'>❌ 答錯了，再接再厲！</span>";
                if (!userProgress.wrongBook.includes(currentQuestion.id)) {
                    userProgress.wrongBook.push(currentQuestion.id);
                }
            }

            saveUserData();

            document.getElementById("correctAnswerText").innerText = Array.isArray(currentQuestion.answer) ? currentQuestion.answer.join(", ") : currentQuestion.answer;
            document.getElementById("explanationText").innerText = currentQuestion.exp;
            document.getElementById("explanationContainer").classList.remove("hidden");
        }

        function openWrongBook() {
            document.getElementById("menuSection").classList.add("hidden");
            document.getElementById("wrongBookSection").classList.remove("hidden");

            const wrongList = document.getElementById("wrongList");
            wrongList.innerHTML = "";

            if (userProgress.wrongBook.length === 0) {
                wrongList.innerHTML = "<div class='text-center text-slate-500 py-12 bg-white rounded-xl shadow'>尚無錯題紀錄，繼續加油！</div>";
                return;
            }

            const allDb = [...easyDatabase, ...sprintDatabase];
            userProgress.wrongBook.forEach((qId, idx) => {
                const q = allDb.find(item => item.id === qId);
                if (!q) return;

                const card = document.createElement("div");
                card.className = "bg-white rounded-xl shadow p-5 border-l-4 border-rose-500";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs bg-rose-100 text-rose-800 font-bold px-2 py-0.5 rounded">錯題 #${idx + 1}</span>
                        <span class="text-xs text-slate-400">${q.source}</span>
                    </div>
                    <h4 class="font-bold text-slate-800 mb-3">${q.title}</h4>
                    <div class="text-xs text-emerald-700 font-semibold mb-2">【正確答案】：${Array.isArray(q.answer) ? q.answer.join(", ") : q.answer}</div>
                    <div class="text-xs text-slate-600 bg-slate-50 p-3 rounded leading-relaxed">【解析】：${q.exp}</div>
                `;
                wrongList.appendChild(card);
            });
        }
    </script>
</body>
</html>
